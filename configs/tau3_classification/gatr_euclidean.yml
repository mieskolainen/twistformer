# Geometric-algebra transformer steering
#
# mikael.mieskolainen@cern.ch (2026)

include: gatr_projective.yml
model:
  gatr_algebra: euclidean
  gatr_input_scale: 0.001
  # Subtract the unweighted hit centroid after the common scale
  gatr_center: true

task:
  lossfunc: cross_entropy
  balance_classes: true

preprocessing:
  # Raw x,y,z [mm], common gatr_input_scale before algebra embedding
  # No per-axis z-scores, auxiliary E stays raw in GeV
  normalize_features: false
  # Classification uses integer class labels, this switch has no effect
  normalize_targets: false
