model:
  depth: 12
  xgboost_sketch_rows: 0  # Use all training showers for histogram boundaries
  xgboost_params:
    booster: gbtree
    objective: binary:logistic
    tree_method: hist
    reg_alpha: 0.0        # L1 penalty on leaf scores
    reg_lambda: 2.0       # L2 penalty on leaf scores
    gamma: 0.0            # Minimum loss reduction per split
    grow_policy: lossguide
    max_leaves: 48
    min_child_weight: 5
    subsample: 0.68
    colsample_bytree: 0.5
    colsample_bylevel: 1.0
    colsample_bynode: 0.65
    num_parallel_tree: 3
    max_bin: 64
    max_cached_hist_node: 32

training:
  device: auto
  epochs: 1000
  patience: 100
  learning_rate: 0.06
  
  scheduler: none
  warmup_epochs: 0
  
  monitor: val_auc
  mode: max
  augmentation: none  # Reflected hits give the same graph rows
