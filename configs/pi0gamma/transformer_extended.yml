# Transformer model definition
#
# mikael.mieskolainen@cern.ch (2026)

include: common.yml

model:
  attention_backend: sdpa # sdpa, flex or auto
  family: transformer
  attention: standard
  attention_neighbors: 0  # Full attention
  pair_bias: none
  reference_token: none
  width: 64
  heads: 4
  depth: 6                # more training data -> more depth
  expansion: 2
  norm: rms
  embedding: [64, 64, 128]
  embedding_norm: layer
  ffn_activation: geglu
  ffn_norm: layer
  head_norm: rms
  head_layers: 3
  head_expansion: 2
  head_residual: true
  head_dropout: 0.01
  head_zero_init: true
  dropout: 0.01
  embedding_dropout: 0.01
  residual_dropout: 0.01
  attention_dropout: 0.0
  pooling: mean
  checkpoint_blocks: true
