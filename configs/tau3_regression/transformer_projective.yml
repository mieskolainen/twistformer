# Tau regression with projective distance attention
#
# mikael.mieskolainen@cern.ch (2026)

include: transformer.yml

model:
  attention: projective
  projective_channels: 2
  projective_coordinates: [x, y, z]
  projective_input_scale: 0.001
training:
  scheduler: cosine
  warmup_epochs: 3
preprocessing:
  # Raw features, common projective_input_scale on x,y,z [mm]
  # Scale enters both token embedding and distance attention
  # Other feature channels stay raw, no per-axis z-scores
  normalize_features: false
  # Train-event z-scores for each of px,py,pz [GeV] and dx,dy,dz [mm]
  # Inverse prediction restores means and widths to physical units
  normalize_targets: true
