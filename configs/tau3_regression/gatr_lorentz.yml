# Geometric-algebra transformer steering
#
# mikael.mieskolainen@cern.ch (2026)

include: gatr_projective.yml
model:
  gatr_algebra: lorentz
  gatr_input: p4
  gatr_input_scale: 0.1
  # Keep uncentered momentum components
  gatr_center: false
  auxiliary_features: []
  gatr_spurions: frame  # none, time, beam, beam_plane or frame

preprocessing:
  # Geometry uses separate p4 with one common gatr_input_scale
  # No centering or per-component z-scores, no auxiliary features
  normalize_features: false
  # Train-event z-scores for each of px,py,pz [GeV] and dx,dy,dz [mm]
  # Inverse prediction restores means and widths to physical units
  normalize_targets: true
